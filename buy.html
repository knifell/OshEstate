<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Купить недвижимость - OshEstate</title>
    <link rel="stylesheet" href="style_main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDK (Compat version for old-style usage) -->
    <script>if(localStorage.getItem('oshe_theme')==='dark')document.documentElement.setAttribute('data-theme','dark');</script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
</head>
<body data-page="sale"> <div id="toast-container"></div>

    <nav class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="logo">Osh<span>Estate</span></a>
            <ul class="nav-links" id="nav-links-container">
                <li><a href="index.html">Главная</a></li>
                <li><a href="buy.html">Купить</a></li>
                <li><a href="rent.html">Снять</a></li>
                <li><a href="land.html">Участки</a></li>
                <li><a href="commerce.html">Коммерция</a></li>
                <li><a href="login.html">Войти</a></li>
                <li><a href="register.html" class="btn-login">Регистрация</a></li>
            </ul>
            <button id="darkModeToggle" class="dark-mode-btn" aria-label="Переключить тему"><i class="fas fa-moon"></i></button>
            <div class="menu-toggle"><i class="fas fa-bars"></i></div>
        </div>
    </nav>

    <div class="page-header">
        <div class="container">
            <div class="page-header-breadcrumb"><a href="index.html">Главная</a><i class="fas fa-chevron-right" style="font-size:0.65rem"></i><span>Купить</span></div>
            <div class="page-header-badge"><i class="fas fa-key"></i> Продажа</div>
            <h1>Продажа недвижимости в Оше</h1>
            <p class="page-header-sub">Квартиры и дома для покупки</p>
        </div>
    </div>

    <div class="fbar-wrapper">
        <div class="container">
            <div class="fbar-top">
                <div class="fbar-search">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchInput" placeholder="Адрес, район, описание...">
                    <div id="searchDropdown" class="search-dropdown" style="display:none;"></div>
                </div>
                <select id="sortFilter" class="fbar-sort">
                    <option value="newest">Сначала новые</option>
                    <option value="price-low">Цена: дешевле</option>
                    <option value="price-high">Цена: дороже</option>
                    <option value="size-large">Площадь: больше</option>
                    <option value="size-small">Площадь: меньше</option>
                </select>
                <button class="fbar-toggle-btn" id="fbarToggleBtn" onclick="toggleFbar()">
                    <i class="fas fa-sliders-h"></i> Фильтры
                    <span class="fbar-badge" id="fbarBadge" style="display:none">0</span>
                </button>
            </div>
            <div class="fbar-panel" id="fbarPanel">
                <div class="fbar-grid">
                    <div class="fbar-field">
                        <label class="fbar-label">Тип жилья</label>
                        <select id="categoryFilter" class="fbar-select">
                            <option value="">Все типы</option>
                            <option value="flat">🏢 Квартиры</option>
                            <option value="house">🏠 Дома</option>
                        </select>
                    </div>
                    <div class="fbar-field">
                        <label class="fbar-label">Регион / район</label>
                        <select id="districtFilter" class="fbar-select">
                            <option value="">Все регионы</option>
                        </select>
                    </div>
                    
                    
                    <div class="fbar-field">
                        <label class="fbar-label">Комнат</label>
                        <select id="roomsFilter" class="fbar-select">
                            <option value="">Любое кол-во</option>
                            <option value="1">1 комната</option>
                            <option value="2">2 комнаты</option>
                            <option value="3">3 комнаты</option>
                            <option value="4">4 комнаты</option>
                            <option value="5+">5+ комнат</option>
                        </select>
                    </div>
                    <div class="fbar-field fbar-field--wide">
                        <label class="fbar-label">Цена (сом)</label>
                        <div class="fbar-price-range">
                            <input type="number" id="minPriceFilter" class="fbar-price-input" placeholder="от">
                            <span class="fbar-price-dash">—</span>
                            <input type="number" id="maxPriceFilter" class="fbar-price-input" placeholder="до">
                        </div>
                    </div>
                    <div class="fbar-field">
                        <label class="fbar-label">Мебель</label>
                        <select id="furnitureFilter" class="fbar-select">
                            <option value="">Любая</option>
                            <option value="yes">С мебелью</option>
                            <option value="no">Без мебели</option>
                            <option value="partial">Частично</option>
                        </select>
                    </div>
                    <div class="fbar-field" id="houseTypeFilterField" style="display:none;">
                        <label class="fbar-label">Тип дома</label>
                        <select id="houseTypeFilter" class="fbar-select">
                            <option value="">Любой тип</option>
                            <option value="brick">Кирпичный</option>
                            <option value="block">Блочный</option>
                            <option value="wood">Деревянный</option>
                            <option value="monolithic">Монолитный</option>
                            <option value="panel">Панельный</option>
                            <option value="other">Другой</option>
                        </select>
                    </div>
                    <div class="fbar-field" id="landAreaFilterField" style="display:none;">
                        <label class="fbar-label">Площадь участка (сотки)</label>
                        <select id="landAreaFilter" class="fbar-select">
                            <option value="">Любая</option>
                            <option value="1">до 1 сотки</option>
                            <option value="2">до 2 соток</option>
                            <option value="3">до 3 соток</option>
                            <option value="5">до 5 соток</option>
                            <option value="10">до 10 соток</option>
                            <option value="20">до 20 соток</option>
                            <option value="50">до 50 соток</option>
                        </select>
                    </div>
                </div>
                <div class="fbar-actions">
                    <button class="fbar-apply-btn" onclick="applyFilters()">
                        <i class="fas fa-check"></i> Применить
                    </button>
                    <button class="fbar-reset-btn" onclick="resetFilters()">
                        <i class="fas fa-times"></i> Сбросить
                    </button>
                </div>
            </div>
        </div>
    </div>

    <section class="container section">
        <div class="results-header">
            <h2>Найдено объектов: <span id="resultsCount">0</span></h2>
            <div class="view-toggle">
                <button class="view-btn active" data-view="grid" onclick="setView('grid')">
                    <i class="fas fa-th"></i>
                </button>
                <button class="view-btn" data-view="list" onclick="setView('list')">
                    <i class="fas fa-list"></i>
                </button>
            </div>
        </div>
        
        <div class="listings-grid" id="listings-container">
            <div class="loader">Загрузка объявлений...</div>
        </div>
        
        <div class="pagination" id="pagination">
            <!-- Пагинация будет добавлена через JS -->
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
